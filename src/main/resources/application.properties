spring.application.name=${SERVICE_NAME:processing-service}

# Server -----------------------------------------------------------------
# Overridable so several instances can be started side-by-side for the
# competing-consumers / horizontal-scaling demo (see README "Skalierung").
server.port=${SERVER_PORT:8081}

# RabbitMQ connection ------------------------------------------------------
# Credentials come from configuration/environment variables, never hardcoded.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# A failure of this service must never block Noah's order acceptance: don't
# retry forever on the template side, and let the listener container manage
# its own reconnect/backoff towards RabbitMQ independently of Noah.
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3

# Shared messaging contract (Contract First) --------------------------------
# Source of truth: shared AsyncAPI / LEVI HANDOFF. No such handoff exists yet
# in this repository, so these are a documented local placeholder - see
# docs/asyncapi.yaml and README "Contract Status" before wiring this up
# against Noah's real Order Service.
app.messaging.exchange=order.events
app.messaging.order-created-routing-key=order.created
app.messaging.order-processed-routing-key=order.processed
app.messaging.order-created-queue=processing-service.order-created.queue

# Processing simulation ------------------------------------------------------
# Deliberately a few seconds so RabbitMQ buffering/backpressure and scaling
# effects are visible in the live demo.
processing.time-ms=${PROCESSING_TIME_MS:2500}
processing.service-name=${SERVICE_NAME:processing-service}

# Actuator -------------------------------------------------------------------
# Minimal health endpoint only; no business/order API is exposed here, so no
# OIDC login is wired in (see README "Security / Service Boundary").
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
