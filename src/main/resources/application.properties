spring.application.name=${SERVICE_NAME:processing-service}
server.port=${SERVER_PORT:8082}

# RabbitMQ connection ------------------------------------------------------
# Credentials come from configuration/environment variables, never hardcoded.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# A failure of this service must never block Noah's order acceptance: don't
# retry forever on the template side, and let the listener container manage
# its own reconnect/backoff towards RabbitMQ independently of Noah.
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.max-attempts=3
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Shared messaging contract (Contract First) --------------------------------
# Source of truth: the Order Service AsyncAPI contract.
app.messaging.exchange=orders.events
app.messaging.order-created-routing-key=order.created.v1
app.messaging.order-processed-routing-key=order.processed.v1
app.messaging.order-created-queue=orders.processing
app.messaging.dead-letter-exchange=orders.dlx
app.messaging.order-created-dlq=orders.processing.dlq

# Processing simulation ------------------------------------------------------
# Deliberately a few seconds so RabbitMQ buffering/backpressure and scaling
# effects are visible in the live demo.
processing.time-ms=${PROCESSING_TIME_MS:2500}
processing.service-name=${SERVICE_NAME:processing-service}
processing.fail-product=${FAIL_PRODUCT:FAIL-DEMO}
app.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:500}

# Autonomous Processing Service persistence.
spring.datasource.url=${PROCESSING_DB_URL:jdbc:postgresql://localhost:5432/m321?currentSchema=processing_service}
spring.datasource.username=${PROCESSING_DB_USERNAME:processing_service}
spring.datasource.password=${PROCESSING_DB_PASSWORD:processing-local}
spring.flyway.schemas=processing_service
spring.flyway.default-schema=processing_service
spring.flyway.create-schemas=false

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.otlp.metrics.export.enabled=false
logging.structured.format.console=${STRUCTURED_LOG_FORMAT:logstash}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
